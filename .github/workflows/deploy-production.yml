name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_PRODUCTION after staging approval
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hacktor-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_DEPLOYMENTS_ENABLED == 'true' && inputs.confirmation == 'DEPLOY_PRODUCTION' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Refuse placeholder resource identifiers
        run: node scripts/assert-deploy-ready.mjs production
      - name: Deploy production workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter @hacktor/web exec wrangler deploy --env production
          pnpm --filter @hacktor/ai-consumer exec wrangler deploy --env production
          pnpm --filter @hacktor/ingestion exec wrangler deploy --env production
