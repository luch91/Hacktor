<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hacktor is a structured Deep Ideation Studio for differentiated, evidence-aware hackathon concepts."
    />
    <meta name="color-scheme" content="dark light" />
    <script>
      (() => {
        const saved = localStorage.getItem('hacktor-theme') || 'dark';
        const resolved =
          saved === 'system'
            ? matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
            : saved;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themePreference = saved;
      })();
    </script>
    <title>Hacktor | Deep Ideation Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
